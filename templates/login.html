<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Office Day System Login</title>
<style>
    * { box-sizing:border-box; }
    body {
        margin:0; min-height:100vh; display:grid; place-items:center;
        font-family:Inter,"Segoe UI",Arial,sans-serif;
        background:linear-gradient(135deg,#064e3b,#059669);
        color:#0f172a; padding:20px;
    }
    .login-card {
        width:100%; max-width:430px; background:white; border-radius:18px;
        padding:34px; box-shadow:0 20px 55px rgba(2,44,34,.28);
    }
    .logo {
        width:58px;height:58px;border-radius:15px;background:#059669;color:white;
        display:grid;place-items:center;margin:0 auto 15px;font-weight:800;font-size:21px;
    }
    h1 { text-align:center; margin:0; font-size:26px; }
    .subtitle { text-align:center; color:#64748b; margin:7px 0 27px; }
    label { display:block; font-weight:650; margin-bottom:7px; }
    input {
        width:100%; padding:12px; margin-bottom:17px; border:1px solid #cbd5e1;
        border-radius:9px; font-size:15px;
    }
    input:focus { outline:3px solid #d1fae5; border-color:#059669; }
    button {
        width:100%; padding:13px; border:0; border-radius:9px;
        background:#059669;color:white;font-size:16px;font-weight:700;cursor:pointer;
    }
    button:hover { background:#047857; }
    .message { padding:11px;border-radius:8px;margin-bottom:16px; }
    .success { background:#dcfce7;color:#166534; }
    .error { background:#fee2e2;color:#991b1b; }
    .accounts {
        margin-top:20px; padding:14px; background:#ecfdf5; color:#065f46;
        border-radius:9px; font-size:13px; line-height:1.65;
    }
</style>
</head>
<body>
<div class="login-card">
    <div class="logo">CEO</div>
    <h1>Office Day Scheduling System</h1>
    <p class="subtitle">CEO Group of Companies</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="message {{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}">
        <label for="username">Username</label>
        <input id="username" type="text" name="username" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" type="password" name="password" autocomplete="current-password" required>
        <button type="submit">Log In</button>
    </form>

    
</div>
</body>
</html>
